name: PayPulse CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  static-analysis:
    name:  1. Format, Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Check Formatting (Prettier)
        run: npx prettier --check "src/**/*.ts"

      - name: Run Linter (ESLint)
        run: npx eslint "src/**/*.ts"

      - name: Check TypeScript Compilation
        run: npx tsc --noEmit

  unit-and-property-tests:
    name:  2. Unit & Property-Based Tests
    needs: static-analysis
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
      - run: npm ci
      - run: npx prisma generate
      - name: Run Jest Unit Tests
        run: npm run test

  integration-and-e2e-tests:
    name:  3. Testcontainers Integration & E2E Tests
    needs: unit-and-property-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Verify Docker in GitHub Runner
        run: docker info

      - run: npm ci
      - run: npx prisma generate

      - name: Run Integration & E2E API Test Suites
        run: npm run test:e2e
        env:
          NODE_ENV: test

  docker-build:
    name:  4. Build Production Docker Image
    needs: integration-and-e2e-tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Production Docker Image
        run: docker build -t paypulse:latest .

  deploy:
    name: Deploy to Render Cloud
    needs: docker-build
    if: github.ref == 'ref/heads/main' && github.event_name == 'push'
    runs_on: ubuntu-latest
    steps:
     - name: Trigger Render Cloud      Deployment  
    run: |
      echo "Al 4 quality gates passed! Triggering Render deployment..." 
      curl -X POST "${{secrets>RENDER_DEPLOY_HOOK_URL}}"    