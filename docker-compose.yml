version: '3.8'

services:
  redis:
    image: redis:7-alpine
    container_name: paypulse-redis
    ports: 
     - "6379:6379"

  paypulse-app:
    build:  
      context: .
      dockerfile: Dockerfile

    container_name: paypulse-app
    ports:
     - "3000:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL}  
      REDIS_HOST: "redis"
      REDIS_PORT: 6379
    depends_on:
     - redis  
  
